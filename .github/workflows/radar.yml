name: Anime Trend RSS Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

permissions:
  contents: write

concurrency:
  group: anime-trend-rss-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Collecter les flux RSS
        id: collect
        continue-on-error: true
        run: node scripts/collect-rss.mjs

      - name: Enregistrer les données et le rapport
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-news.json data/reports.json
          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi
          git commit -m "chore: actualise le radar anime et le rapport"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "Données publiées (tentative $attempt)."
              exit 0
            fi
            echo "Échec du push, nouvelle tentative dans 5 s…"
            sleep 5
          done
          echo "::error::Impossible de pousser les données après 3 tentatives."
          exit 1

      - name: Bilan de la collecte
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::La collecte n'a obtenu aucun flux. Les données précédentes ont été conservées. Voir data/reports.json."
          exit 1
